<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo Mario</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍄</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1 class="hud__title">🍄 Jogo Mario</h1>
        <div class="hud__stats">
          <span>Moedas: <strong id="coins">0</strong></span>
          <span>Vidas: <strong id="lives">3</strong></span>
          <span>Tempo: <strong id="time">0</strong></span>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="800" height="400"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay__box">
            <h2 id="overlay-title">Jogo Mario</h2>
            <p id="overlay-text">Use as setas ou A / D para mover e Espaço para pular.</p>
            <p class="overlay__hint">Pressione <kbd>Enter</kbd> para começar</p>
          </div>
        </div>
      </div>

      <footer class="controls">
        <p><kbd>←</kbd><kbd>→</kbd> mover &nbsp;•&nbsp; <kbd>Espaço</kbd> pular &nbsp;•&nbsp; <kbd>Enter</kbd> iniciar/reiniciar</p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
